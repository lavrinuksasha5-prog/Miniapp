<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Статистика ссылок</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
        }
        .header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 16px;
            text-align: center;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .name {
            font-weight: 500;
            font-size: 15px;
            word-break: break-word;
            max-width: 50%;
        }
        .stats {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            font-size: 14px;
        }
        .req { color: #f39c12; font-weight: bold; }
        .join { color: #2ecc71; font-weight: bold; }
        .loader {
            text-align: center;
            padding: 20px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="header">📊 Аналитика ссылок</div>
    <div id="list" class="loader">Загрузка данных...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Твоя ссылка с Railway
        const API_URL = "https://worker-production-b9f1.up.railway.app/api/stats";

        async function fetchStats() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const listEl = document.getElementById('list');
                
                if (data.length === 0) {
                    listEl.innerHTML = "Пока нет данных. Как только пойдут заявки — они появятся здесь.";
                    return;
                }

                // Сортируем по количеству заявок (по убыванию)
                data.sort((a, b) => b.requests - a.requests);

                let html = "";
                data.forEach(item => {
                    html += `
                        <div class="card">
                            <div class="name">${item.name}</div>
                            <div class="stats">
                                <span class="req">Заявки: ${item.requests}</span>
                                <span class="join">Вступили: ${item.joins}</span>
                            </div>
                        </div>
                    `;
                });
                listEl.innerHTML = html;
            } catch (e) {
                document.getElementById('list').innerHTML = "Ошибка загрузки данных. Проверь связь с сервером.";
            }
        }

        // Загружаем при открытии
        fetchStats();
        // И обновляем каждые 5 секунд (в реальном времени)
        setInterval(fetchStats, 5000);
    </script>
</body>
</html>
